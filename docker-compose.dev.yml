services:
  # MariaDB database for MONARC BackOffice
  bodb:
    image: mariadb:10.11
    container_name: monarc-bo-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DBPASSWORD_ADMIN}
      # The official MariaDB image only auto-creates the initial DB from MYSQL_DATABASE.
      MYSQL_DATABASE: ${DBNAME_COMMON}
      MYSQL_USER: ${DBUSER_MONARC}
      MYSQL_PASSWORD: ${DBPASSWORD_MONARC}
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --bind-address=0.0.0.0
      - --default-time-zone=+00:00
    ports:
      - "${BODB_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - monarc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DBPASSWORD_ADMIN}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main MONARC BackOffice application
  monarcboapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-1}
        XDEBUG_MODE: ${XDEBUG_MODE:-debug}
        XDEBUG_START_WITH_REQUEST: ${XDEBUG_START_WITH_REQUEST:-trigger}
        XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
        XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
        XDEBUG_IDEKEY: ${XDEBUG_IDEKEY:-IDEKEY}
        XDEBUG_DISCOVER_CLIENT_HOST: ${XDEBUG_DISCOVER_CLIENT_HOST:-0}
    container_name: monarc-bo-app
    environment:
      TZ: UTC
      DBHOST: bodb
      DBNAME_COMMON: ${DBNAME_COMMON}
      DBNAME_MASTER: ${DBNAME_MASTER}
      DBUSER_MONARC: ${DBUSER_MONARC}
      DBPASSWORD_MONARC: ${DBPASSWORD_MONARC}
      DBPASSWORD_ADMIN: ${DBPASSWORD_ADMIN}
      APP_ENV: development
      APP_DIR: /var/www/html/monarc
    ports:
      - "5002:80"
    depends_on:
      bodb:
        condition: service_healthy
    networks:
      - monarc-network
    volumes:
      # Mount the application code for live development
      - ./:/var/www/html/monarc
      # Mount sibling repositories so Composer path symlinks and node_modules links resolve in-container
      - type: bind
        source: ../zm-core
        target: /var/www/html/zm-core
        bind:
          create_host_path: false
      - type: bind
        source: ../zm-backoffice
        target: /var/www/html/zm-backoffice
        bind:
          create_host_path: false
      - type: bind
        source: ../ng-anr
        target: /var/www/html/ng-anr
        bind:
          create_host_path: false
      - type: bind
        source: ../ng-backoffice
        target: /var/www/html/ng-backoffice
        bind:
          create_host_path: false
      # Preserve vendor directory in named volume for better performance
      - vendor_data:/var/www/html/monarc/vendor
      - node_modules_data:/var/www/html/monarc/node_modules
    working_dir: /var/www/html/monarc
    healthcheck:
      # Keep this probe independent of the Scenario rollout flag: the BFF
      # needs a live MONARC bridge host even while Scenario remains disabled.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1/api/scenario/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Same-origin Scenario BFF. It has no host port: Apache is the only entry
  # point and proxies /scenario after the server-side feature check.
  scenario-ui-bo:
    build:
      context: ../scenario-ui
      dockerfile: docker/production/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /scenario
    environment:
      SCENARIO_ENABLED: ${SCENARIO_ENABLED:-false}
      SCENARIO_BASE_PATH: /scenario
      SCENARIO_OFFICE: backoffice
      # This is the local Apache HTTP topology only. Production defaults to
      # secure, __Secure-prefixed cookies and rejects this profile.
      SCENARIO_DEPLOYMENT_ENV: development
      SCENARIO_COOKIE_MODE: local-http
      SCENARIO_PUBLIC_ORIGIN: ${SCENARIO_PUBLIC_ORIGIN:-http://127.0.0.1:5002}
      SCENARIO_API_ORIGIN: http://monarcboapp
      SCENARIO_AUTH_MODE: legacy
      SCENARIO_LEGACY_BRIDGE_EXCHANGE_URL: http://monarcboapp/api/scenario/v1/auth/bridge/consume
      SCENARIO_LEGACY_BRIDGE_SERVICE_TOKEN: ${SCENARIO_LEGACY_BRIDGE_SERVICE_TOKEN:-}
    depends_on:
      monarcboapp:
        condition: service_healthy
    networks:
      - monarc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/scenario/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  monarc-network:
    name: ${MONARC_NETWORK_NAME:-monarc-network}
    external: true

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: ./docker/db_data
      o: bind
  vendor_data:
    driver: local
    driver_opts:
      type: none
      device: ./vendor
      o: bind
  node_modules_data:
    driver: local
    driver_opts:
      type: none
      device: ./node_modules
      o: bind
