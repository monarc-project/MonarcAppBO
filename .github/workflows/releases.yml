name: MonarcAppBO releases

on:
  push:
    branches: [ 'master' ]
    tags: [ 'v*.*', 'v*.*.*', 'v*.*.*-*' ]
  pull_request:
    branches: [ 'master' ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ "16.x" ]
        php-version: [ "8.4" ]

    steps:
    - uses: actions/checkout@v2

    - name: install deps
      run: sudo apt-get update && sudo apt install -y gettext

    # PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      env:
        update: "true"
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer:v2
        extensions: bcmath

    # javascript
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: Assemble locked backend and frontend releases
      run: bash scripts/prepare-release.sh

    # prepare release
    - name: Get repository name
      id: repository
      run: echo "::set-output name=pathref::$(echo '${{ github.repository }}' | cut -d'/' -f2)-$(echo '${{ github.ref_name }}' | sed 's/[^[:alnum:]\.-]/_/g')"

    - name: create artifact archive
      run: |
        tar --exclude .git --exclude .github -zcf '../${{ steps.repository.outputs.pathref }}.tar.gz' .

    - name: release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ../${{ steps.repository.outputs.pathref }}.tar.gz
        fail_on_unmatched_files: true
      if: startsWith(github.ref, 'refs/tags/')
